name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-tests:
    name: Vitest (JS unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  e2e-tests:
    name: Playwright (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Copy prompt and resume stubs for CI
        run: |
          cp src/prompts/experienceMapping.stub.txt src/prompts/experienceMapping.txt
          cp src/prompts/skipConditions.stub.txt src/prompts/skipConditions.txt
          cp src/prompts/salaryRules.stub.txt src/prompts/salaryRules.txt
          cp src/prompts/promptTemplate.stub.txt src/prompts/promptTemplate.txt
          cp data/resume.stub.txt data/resume.txt

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  python-tests:
    name: pytest (LLM evaluation suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest requests

      - name: Run pytest (unit tests only)
        run: pytest tests/python/ -v --ignore=tests/python/venv
