name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-tests:
    name: Vitest (JS unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  python-tests:
    name: pytest (LLM evaluation suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run pytest (unit tests only)
        run: pytest tests/python/ -v --ignore=tests/python/venv
